name: Verify foundation content
on:
  push:
    branches: ['content/foundation-*']
  workflow_dispatch:
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate and verify
        run: |
          npm run generate:index
          npm run verify
          node scripts/validate-foundation.mjs
          if [ -f scripts/test-foundation-math.mjs ]; then node scripts/test-foundation-math.mjs; fi
      - name: Browser verification
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
          node scripts/test-foundation-browser.mjs
      - name: Save verified artifacts for release candidates only
        if: startsWith(github.ref, 'refs/heads/content/foundation-')
        run: |
          STAGE=$(node -e "const fs=require('fs'); const p='src/data/foundation-release.json'; console.log(fs.existsSync(p)?JSON.parse(fs.readFileSync(p)).stage:'drafting')")
          if [ "$STAGE" != 'release_candidate' ]; then echo 'Checkpoint tested; generated files stay out of draft commits.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs src/generated project-docs/learning-platform-design
          if ! git diff --cached --quiet; then
            git commit -m 'build: verify and generate complete foundation release'
            git push origin HEAD:${{ github.ref_name }}
          fi
