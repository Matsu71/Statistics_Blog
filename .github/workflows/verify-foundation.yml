name: Verify foundation content

on:
  push:
    branches: ['content/foundation-*']
  workflow_dispatch:

concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate and verify the entire site
        run: |
          npm run generate:index
          npm run verify
          if [ -f scripts/validate-foundation.mjs ]; then
            node scripts/validate-foundation.mjs
          fi
      - name: Test foundation pages in Chromium
        run: |
          if [ -f scripts/test-foundation-browser.mjs ]; then
            npm install --no-save --package-lock=false playwright@1.55.0
            npx playwright install --with-deps chromium
            node scripts/test-foundation-browser.mjs
          fi
      - name: Record generated site on the staging branch only
        if: startsWith(github.ref, 'refs/heads/content/foundation-')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs src/generated/term-index.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: regenerate verified static learning pages'
            git push origin HEAD:${{ github.ref_name }}
          fi
