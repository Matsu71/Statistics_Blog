name: Foundation public integrity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/foundation-public-integrity.yml
      - scripts/verify-published-foundation.py

permissions:
  contents: read

concurrency:
  group: foundation-public-integrity
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify deployed release without rebuilding or publishing
        run: python3 scripts/verify-published-foundation.py
      - name: Preserve the exact observed outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-public-integrity-${{ github.run_id }}
          path: project-docs/foundation-release/postrelease-integrity.json
          retention-days: 30
          if-no-files-found: warn
      - name: Checkpoint passed evidence and next actions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project-docs/foundation-release/postrelease-integrity.json project-docs/learning-platform-design/11-completion-progress.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: confirm all published foundation resources and next actions [skip ci]'
            git push origin HEAD:main
          fi
