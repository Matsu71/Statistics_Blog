name: Promote verified grade2 artifact
on:
  push:
    branches: [content/grade2-complete-20260911, main]
    paths:
      - .github/workflows/promote-grade2-artifact.yml
      - scripts/recover-verified-grade2.py
      - docs/grade2-release-marker.json
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: grade2-artifact-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recover:
    if: github.ref == 'refs/heads/content/grade2-complete-20260911'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Recover the exact tested artifact, without changing workflow files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/recover-verified-grade2.py recover
      - name: Save the candidate on its working branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts public docs review project-docs
          test -z "$(git diff --cached --name-only -- .github)"
          git commit -m 'release: recover hash-verified grade2 content and generated site'
          git push origin HEAD:content/grade2-complete-20260911
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grade2-recovery-${{ github.run_id }}
          path: project-docs/grade2/release/recovery.json
  confirm:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify the actual public resources and both courses
        run: python3 scripts/recover-verified-grade2.py public
      - name: Checkpoint public confirmation and next work
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add project-docs/grade2
          git commit -m 'docs: confirm live grade2 release and next pre-grade1 work [skip ci]'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grade2-public-confirmation-${{ github.run_id }}
          path: project-docs/grade2/release/
